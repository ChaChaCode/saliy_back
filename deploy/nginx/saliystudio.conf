# ─────────────────────────────────────────────────────────────────────────────
# saliystudio.com + www — та же витрина, что saliyclothes: фронт Next.js SSR
# (:3001) и API NestJS (:3000). Тот же бэк и фронт, другой домен.
# Ставится в /etc/nginx/sites-available/saliystudio, симлинк в sites-enabled.
#
# Зависит от http-tuning.conf (map $connection_upgrade, upstream saliy_api /
# saliy_front, limit_req_zone api_limit, gzip_types).
#
# SSL-строки ставит certbot ПОСЛЕ переключения DNS saliystudio.com на этот
# сервер. До сертификата — конфиг поднимается только на :80 (см. низ файла);
# 443-блок раскомментировать/дополнит certbot.
#
# ВНИМАНИЕ: ipv6only=on тут НЕ ставим — этот флаг допустим лишь у одного
# server-блока на [::]:443 в пределах nginx (он уже у saliyclothes).
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name saliystudio.com www.saliystudio.com;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/saliystudio.com/fullchain.pem;       # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/saliystudio.com/privkey.pem;     # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                           # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                             # managed by Certbot

    client_max_body_size 25M;

    # ── Security-заголовки страниц фронта (на /api — свои от helmet) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Статика Next с диска, минуя Node (тот же saliy_front) ──
    location /_next/static/ {
        alias /home/deploy/apps/saliy_front/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── API → NestJS :3000 (тот же бэк) ──
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://saliy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Всё остальное → Next.js SSR :3001 ──
    location / {
        proxy_pass http://saliy_front;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# ── HTTP → HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name saliystudio.com www.saliystudio.com;
    return 301 https://$host$request_uri;
}
