# ─────────────────────────────────────────────────────────────────────────────
# admin.saliyclothes.com — старый адрес админки, перенаправление на
# admin.saliystudio.com. Ставится в /etc/nginx/sites-available/admin.saliyclothes
# (заменяет прежний конфиг).
#
# Страницы → 301 на тот же путь на admin.saliystudio.com. Вход в админку
# привязан к куке своего домена, поэтому на новом адресе нужно войти заново.
# /api/ проксируется как раньше — для уже открытых старых вкладок.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name admin.saliyclothes.com;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/saliyclothes.com/fullchain.pem;      # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/saliyclothes.com/privkey.pem;    # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                           # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                             # managed by Certbot

    client_max_body_size 100M;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://saliy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 301 https://admin.saliystudio.com$request_uri;
    }
}

# ── HTTP → сразу на новый адрес ──
server {
    listen 80;
    listen [::]:80;
    server_name admin.saliyclothes.com;
    return 301 https://admin.saliystudio.com$request_uri;
}
