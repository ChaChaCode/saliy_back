# ─────────────────────────────────────────────────────────────────────────────
# saliyclothes.com + www — старый домен, перенаправление на saliystudio.com.
# Ставится в /etc/nginx/sites-available/saliyclothes (заменяет прежний конфиг).
#
# Страницы → 301 на тот же путь на saliystudio.com.
# /api/ по-прежнему проксируется в backend без редиректа: на старый адрес ещё
# могут прийти webhook'и (банк, СДЭК) и запросы из старых открытых вкладок, а
# POST через 301 браузеры и сервисы повторяют как GET или не повторяют вовсе.
#
# SSL-строки ставит certbot — оставить как есть, сертификат saliyclothes.com
# нужен, пока домен открывают по https.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name saliyclothes.com www.saliyclothes.com;

    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;

    ssl_certificate /etc/letsencrypt/live/saliyclothes.com/fullchain.pem;      # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/saliyclothes.com/privkey.pem;    # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                           # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                             # managed by Certbot

    client_max_body_size 100M;

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://saliy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 301 https://saliystudio.com$request_uri;
    }
}

# ── HTTP → сразу на новый домен ──
server {
    listen 80;
    listen [::]:80;
    server_name saliyclothes.com www.saliyclothes.com;
    return 301 https://saliystudio.com$request_uri;
}
